name: Prijava napake / Bug report
description: Prijavi težavo ali nepričakovano vedenje
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Hvala za prijavo. Za varnostne ranljivosti **ne** uporabljaj javnega issue-ja — glej [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Povzetek
      description: Kratek opis težave.
      placeholder: Kaj se dogaja?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Koraki za reprodukcijo
      description: Kako lahko težavo ponovimo?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Pričakovano vedenje
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Dejansko vedenje
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Okolje / kontekst
      description: URL, najemnik/slug (brez skrivnosti), brskalnik, naprava, veja/commit, logi.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Posnetki zaslona / logi
      description: Priloži, če pomaga (brez osebnih podatkov ali skrivnosti).
    validations:
      required: false
