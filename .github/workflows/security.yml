name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # CodeQL SARIF upload
  pull-requests: write   # dependency-review comments

jobs:
  # P11 (audit 2026-11): secret scanning (gitleaks) — prepreči, da bi
  # skrivnosti (.env, ključi, tokeni) pristale v zgodovini.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # P11: CodeQL (JavaScript/TypeScript) — statična analiza ranljivosti.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # P11: dependency-review — blokira merge, če PR uvaja ranljive
  # ali sporne odvisnosti (na nivoju PR diffa).
  # Opomba: akcija zahteva vklopljen "Dependency graph" v repo
  # nastavitvah (Settings → Security → Dependency graph). Če ni
  # omogočen, job spodleti — zato ga izvedemo fail-soft: ob
  # napaki opozorimo, a ne blokiramo (gate postane trden, ko
  # lastnik vklopi Dependency graph).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        id: deprev
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Warn if Dependency review unavailable
        if: steps.deprev.outcome == 'failure' && steps.deprev.conclusion == 'failure'
        run: echo "::warning::Dependency review ni uspel (verjetno Dependency graph ni vklopljen v repo nastavitvah). Preverite Settings → Security → Dependency graph."
