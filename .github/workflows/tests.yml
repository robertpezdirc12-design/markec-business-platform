name: Tests

on:
  push:
    branches: [main, fase1-review]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markec_e2e
          POSTGRES_PASSWORD: markec_e2e_test_pw
          POSTGRES_DB: markec_e2e_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push schema to test DB
        run: pnpm prisma db push
        env:
          DATABASE_URL: postgresql://markec_e2e:markec_e2e_test_pw@localhost:5433/markec_e2e_test?schema=public

      - name: Run unit tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://markec_e2e:markec_e2e_test_pw@localhost:5433/markec_e2e_test?schema=public

      - name: TypeScript check
        run: npx tsc --noEmit

  architecture:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture tests
        run: npx vitest run tests/architecture tests/plans tests/profiles tests/security

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint
