name: Tests

on:
  pull_request:
    branches: [main]
  push:
    # main: kakovost na vsak push (Cloudflare deploy je od 2026-11-17 ročni).
    # fase1-review: zgodovinska veja, obdržana za nazaj.
    branches: [main, fase1-review]

permissions:
  contents: read

jobs:
  # Typecheck + Lint on every PR and push to fase1-review
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Dependency cruiser (arhitektura)
        # P2 (audit 2026-11): arhitekturni regresiji (cycle, prepovedani
        # uvoz) se zdaj uveljavljata v CI — lokalno preverjeno brez kršitev.
        run: pnpm depcruise

      - name: Dependency audit (poročilo)
        # FAZA 2.5: samodejno poročilo o ranljivih odvisnostih ob vsaki
        # spremembi. Trenutno ni blokade (39 high — vse transitivne, npr.
        # glob/semver/postcss); ko bo audit čisten, spremeni v trdno
        # `pnpm audit --audit-level=high` (definition of done).
        run: |
          pnpm audit --audit-level=high \
            || echo "::warning::Ranljive odvisnosti so poročene zgoraj — glej Dependabot PR-je."

  # Unit + architecture tests with real Postgres
  test:
    name: Unit & Architecture Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markec_test
          POSTGRES_PASSWORD: markec_test_pw
          POSTGRES_DB: markec_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push schema to test DB
        run: pnpm prisma db push
        env:
          DATABASE_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public
          # schema.prisma zahteva tudi directUrl (P1012 brez njega) — testna
          # baza je lokalna, zato je ista vrednost pravilna.
          DIRECT_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public

      - name: Run unit tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public
          # schema.prisma zahteva tudi directUrl (P1012 brez njega) — testna
          # baza je lokalna, zato je ista vrednost pravilna.
          DIRECT_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public

      - name: Run architecture tests
        run: npx vitest run tests/architecture tests/plans tests/profiles tests/security
        env:
          DATABASE_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public
          # schema.prisma zahteva tudi directUrl (P1012 brez njega) — testna
          # baza je lokalna, zato je ista vrednost pravilna.
          DIRECT_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public

  # Verify the project builds successfully (without deploying)
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      # Same google-fonts flake as the deploy workflow (vercel/next.js#99114).
      - name: Build with OpenNext
        run: |
          for attempt in 1 2 3; do
            echo "### Build attempt $attempt"
            if pnpm run build; then
              echo "::notice::Build succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed — cleaning and retrying"
              rm -rf .next .open-next
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake?schema=public
          NEXTAUTH_SECRET: test-secret-not-real
          AUTH_SECRET: test-secret-not-real
          NEXT_PUBLIC_APP_URL: https://markec-business-platform.robert-pezdirc12.workers.dev
          NEXTAUTH_URL: https://markec-business-platform.robert-pezdirc12.workers.dev
          # Public build-time value (cloud name, not a secret) — inlined into the
          # client bundle; keep the build-check representative of the real build.
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CI: "true"

  # P5 (audit 2026-11) — E2E (Playwright) v CI. Konfiguracija e2e
  # (playwright.config.ts) poganja PRAVI produkcijski build (bunx next
  # build && next start) proti izolirani bazi z seedom prisma/seed.ts.
  # Opozorilo: e2e so bili do zdaj samo ročni (nikoli v CI).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # P5, predobstoječe stanje: e2e suite v CI trenutno ni zelena
    # (prijava z registriranimi računi v produkcijskem buildu spodleti;
    # težji tokovi dosežejo timeoute). Job teče kot poročilo in NE
    # blokira PR-jev, dokler ni odpravljen.
    continue-on-error: true
    # P5 iteracija: časovna omejitev prepreči večurno obviselo
    # izvajanje; workers=4 pospeši zagon.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markec_e2e
          POSTGRES_PASSWORD: markec_e2e_pw
          POSTGRES_DB: markec_e2e
        ports:
          - 5536:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://markec_e2e:markec_e2e_pw@localhost:5536/markec_e2e?schema=public
      DATABASE_URL: postgresql://markec_e2e:markec_e2e_pw@localhost:5536/markec_e2e?schema=public
      DIRECT_URL: postgresql://markec_e2e:markec_e2e_pw@localhost:5536/markec_e2e?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3123
      BASE_URL: http://127.0.0.1:3123
      # P5: v e2e okolju izklopi IP/rate omejitve (vzporedni workerji).
      E2E_RATE_LIMIT_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Bun (bunx v playwright.config.ts)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push schema to E2E DB
        run: pnpm prisma db push

      - name: Seed E2E database
        run: pnpm exec tsx prisma/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --workers=4

  # P1 (audit 2026-11) — MIGRACIJE SE MORATAJO PREIZKUSITI, NE LE `db push`.
  #
  # Prej je CI postavil shemo z `prisma db push`, zato zlomljena ali manjkajoča
  # migracija ni nikoli padla: `migrate deploy` (ki ga poganja produkcijski
  # deploy) na sveži bazi ni bil nikoli preizkušen. Ta job zato:
  #   1) svež Postgres,
  #   2) `prisma migrate deploy` (vse migracije po vrsti),
  #   3) `prisma migrate diff --exit-code` med zmigrirano bazo in
  #      `schema.prisma` → vsaka razlika (shema brez migracije) pade.
  migrations:
    name: Migrations (fresh DB + drift check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markec_mig
          POSTGRES_PASSWORD: markec_mig_pw
          POSTGRES_DB: markec_mig
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://markec_mig:markec_mig_pw@localhost:5434/markec_mig?schema=public
      DIRECT_URL: postgresql://markec_mig:markec_mig_pw@localhost:5434/markec_mig?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Fail on schema/migration drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  # P1 (audit 2026-11) — integracijski (DB) testi so bili ROČNI.
  # 42 `*.itest.ts` datotek pokriva najbolj varnostno občutljive tokove
  # (izolacija najemnikov, GDPR, verifikacija e-pošte …), a jih CI ni poganjal.
  integration-tests:
    name: Integration tests (DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markec_it
          POSTGRES_PASSWORD: markec_it_pw
          POSTGRES_DB: markec_it
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://markec_it:markec_it_pw@localhost:5435/markec_it?schema=public
      DIRECT_URL: postgresql://markec_it:markec_it_pw@localhost:5435/markec_it?schema=public
      NEXTAUTH_SECRET: test-secret-not-real
      AUTH_SECRET: test-secret-not-real
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database (migrations)
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run integration tests
        run: npx vitest run --config vitest.itest.config.ts
