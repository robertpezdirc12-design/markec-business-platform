name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip database migrations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Quality gates — typecheck + lint must pass before build
  # ─────────────────────────────────────────────────────────────
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint

  # ─────────────────────────────────────────────────────────────
  # Job 2: Unit + architecture tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markec_test
          POSTGRES_PASSWORD: markec_test_pw
          POSTGRES_DB: markec_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push schema to test DB
        run: pnpm prisma db push
        env:
          DATABASE_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public
          DIRECT_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public

      - name: Run unit tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public

      - name: Run architecture tests
        run: npx vitest run tests/architecture tests/plans tests/profiles tests/security
        env:
          DATABASE_URL: postgresql://markec_test:markec_test_pw@localhost:5433/markec_test?schema=public

  # ─────────────────────────────────────────────────────────────
  # Job 3: Build + Deploy — only after quality + tests pass
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build & Deploy
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      # Migrations BEFORE build — schema must match code.
      # Uses DIRECT_URL (pooled DATABASE_URL can't run DDL reliably).
      - name: Run database migrations
        if: github.event.inputs.skip_migrations != 'true'
        run: |
          node scripts/resolve-failed-migrations.mjs || true
          npx prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Build — OpenNext for Cloudflare.
      # No .env files in CI, so build-smart.mjs env-hiding is a no-op.
      # Only build-time env is passed; runtime secrets come from Worker bindings.
      # RETRY: next/font/google fetches its CSS from Google at build time and
      # Google occasionally answers with extensionless /l/font?kit=…&skey=…
      # URLs instead of /s/…/<hash>.woff2. Turbopack then fails the whole build
      # with "next/font/google queries have exactly one entry" (upstream bug
      # vercel/next.js#99114, still unfixed in 16.1.4 — it hits ~2 % of
      # responses and varies per family). A clean retry re-rolls the fetch; 3
      # attempts drop the failure rate to well below 1 %.
      - name: Build with OpenNext
        run: |
          for attempt in 1 2 3; do
            echo "### Build attempt $attempt"
            if pnpm run build; then
              echo "::notice::Build succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed — cleaning and retrying"
              rm -rf .next .open-next
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          CI: "true"

      # Deploy the Worker.
      # Node ≥ 22.12 is required by wrangler 4 — with Node 20 the action silently
      # falls back to wrangler 3.90, which cannot bundle the pnpm/Next 16 output
      # ("Unable to extract npm package name from …/.pnpm/…").
      # wranglerVersion is pinned to the version in package.json so CI and local
      # deploys use the same bundler.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.163.0"
          command: deploy .open-next/worker.js --config wrangler.jsonc

      # Push runtime secrets to the Worker. Idempotent — run every deploy.
      # Empty GitHub secrets are skipped, see the guard in the script below.
      - name: Configure all Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SECRET_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SECRET_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SECRET_NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SECRET_NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SECRET_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SECRET_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SECRET_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SECRET_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SECRET_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SECRET_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SECRET_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SECRET_AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          SECRET_AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          set -euo pipefail
          WORKER="markec-business-platform"

          # Empty value ⇒ secret is SKIPPED, never overwritten. A missing
          # GitHub secret must not wipe a working Worker secret (that would
          # silently break R2 uploads / Stripe / email in production).
          # printf (not a here-string) avoids baking a trailing newline into
          # the value — API keys with \n are rejected by the providers.
          put() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --name "$WORKER"
              echo "✓ $name"
            else
              echo "::notice::$name not provided in GitHub secrets — keeping existing Worker secret"
            fi
          }

          put DATABASE_URL "${SECRET_DATABASE_URL:-}"
          put DIRECT_URL "${SECRET_DIRECT_URL:-}"
          put NEXTAUTH_SECRET "${SECRET_NEXTAUTH_SECRET:-}"
          put AUTH_SECRET "${SECRET_AUTH_SECRET:-}"
          put NEXTAUTH_URL "${SECRET_NEXTAUTH_URL:-}"
          put NEXT_PUBLIC_APP_URL "${SECRET_NEXT_PUBLIC_APP_URL:-}"
          put R2_ACCESS_KEY_ID "${SECRET_R2_ACCESS_KEY_ID:-}"
          put R2_SECRET_ACCESS_KEY "${SECRET_R2_SECRET_ACCESS_KEY:-}"
          put R2_ACCOUNT_ID "${SECRET_R2_ACCOUNT_ID:-}"
          put R2_ENDPOINT "${SECRET_R2_ENDPOINT:-}"
          put R2_BUCKET "${SECRET_R2_BUCKET:-}"
          put R2_PUBLIC_URL "${SECRET_R2_PUBLIC_URL:-}"
          put RESEND_API_KEY "${SECRET_RESEND_API_KEY:-}"
          put RESEND_FROM_EMAIL "${SECRET_RESEND_FROM_EMAIL:-}"
          put STRIPE_SECRET_KEY "${SECRET_STRIPE_SECRET_KEY:-}"
          put NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "${SECRET_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
          put AUTH_GOOGLE_ID "${SECRET_AUTH_GOOGLE_ID:-}"
          put AUTH_GOOGLE_SECRET "${SECRET_AUTH_GOOGLE_SECRET:-}"

          echo "Worker secrets configured (empty ones skipped)."

      # Health check — verify the Worker responds after deploy
      - name: Health check
        run: |
          URL="https://markec-business-platform.robert-pezdirc12.workers.dev/api/health"
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE — retrying in 5s…"
            sleep 5
          done
          echo "::warning::Health check failed after 10 attempts — Worker may need time to stabilize or CPU limits may be hit."
          exit 1

      # Summary in GitHub Actions UI
      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality gates | ${{ needs.quality.result == 'success' && ':white_check_mark: OK' || ':x: FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && ':white_check_mark: OK' || ':x: FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Deploy | ${{ job.status == 'success' && ':white_check_mark: OK' || ':x: FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://markec-business-platform.robert-pezdirc12.workers.dev" >> $GITHUB_STEP_SUMMARY
